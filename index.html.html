<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1eaf6">
<title>Пекарня by SARA — Спасибо за отзыв</title>
<style>
  :root {
    --wine: #650d18;
    --wine-dark: #430810;
    --lavender: #eee7f4;
    --ink: #211c24;
    --muted: #817986;
    --paper: rgba(255,255,255,.88);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px 18px;
    display: grid; place-items: center;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255,255,255,.95), transparent 38%),
      radial-gradient(ellipse at 90% 85%, rgba(211,190,224,.55), transparent 42%),
      linear-gradient(145deg, #f2ebf8, #e9e1ef 55%, #f7f3f8);
  }
  .card {
    width: min(100%, 540px); padding: 34px 28px 30px;
    text-align: center; border: 1px solid rgba(255,255,255,.9);
    border-radius: 34px; background: var(--paper);
    box-shadow: 0 24px 70px rgba(66, 36, 72, .12), inset 0 1px 0 #fff;
    backdrop-filter: blur(12px);
    animation: rise .7s ease both;
  }
  @keyframes rise { from {opacity:0; transform:translateY(14px)} to {opacity:1; transform:translateY(0)} }
  .logo-wrap {
    width: min(100%, 370px); margin: 0 auto 22px; padding: 4px 0;
  }
  .logo { width: 100%; height: auto; display:block; mix-blend-mode:multiply; }
  .monogram {
    width: 76px; height: 76px; margin: 8px auto 20px; border-radius: 50%;
    display:grid; place-items:center; background: var(--lavender);
    color: var(--wine); font-family: Georgia, serif; font-size: 38px; font-weight: 700;
  }
  h1 { margin: 0; font-size: clamp(29px, 6vw, 39px); line-height: 1.12; letter-spacing: -.8px; font-weight: 850; }
  .heart { margin: 18px 0 14px; color: var(--wine); font-size: 34px; line-height: 1; }
  .intro { margin: 0 auto 25px; max-width: 390px; color: var(--muted); font-size: 17px; line-height: 1.5; font-weight: 550; }
  .buttons { display:grid; gap: 14px; }
  .review-btn {
    min-height: 88px; padding: 15px 22px; display:flex; align-items:center; justify-content:center; gap:16px;
    border: 1px solid #e5dce9; border-radius: 23px; background: #fff;
    color: var(--wine-dark); text-decoration:none; font-size: 20px; font-weight: 800;
    box-shadow: 0 9px 24px rgba(53, 31, 59, .07);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .review-btn:hover { transform: translateY(-3px); border-color: #c9aab4; box-shadow: 0 14px 28px rgba(75, 28, 47, .13); }
  .review-btn:active { transform: scale(.985); }
  .icon {
    width: 48px; height: 48px; flex: 0 0 48px; display:grid; place-items:center;
    border-radius: 15px; background: #f5edf2; color: var(--wine);
  }
  .icon svg { width: 31px; height: 31px; display:block; }
  .icon { background: transparent; border-radius: 0; }
  .social-label {
    display: flex; align-items: center; gap: 12px; margin: 7px 4px 0;
    color: var(--muted); font-size: 13px; font-weight: 850; letter-spacing: 1.8px;
    text-transform: uppercase;
  }
  .social-label::before, .social-label::after {
    content: ""; height: 1px; flex: 1; background: #e7dfe9;
  }
  .service-icon { width: 48px; height: 48px; object-fit: contain; display: block; }
  .arrow { color:#a99eaa; font-size: 25px; margin-left: -7px; }
  .place { margin: 22px 0 0; color: var(--wine); font-size: 13px; letter-spacing: 2.5px; font-weight: 850; text-transform: uppercase; }
  .thanks { margin: 26px 0 0; color: #aaa1ad; font-size: 14px; line-height:1.5; }
  .thanks span { color: var(--wine); }
  @media (max-width: 390px) {
    body { padding: 15px 12px; }
    .card { padding: 26px 18px 24px; border-radius: 28px; }
    .review-btn { min-height: 78px; font-size: 18px; gap:12px; padding: 12px; }
    .icon { width:44px; height:44px; flex-basis:44px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } }
</style>
</head>
